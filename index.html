<!DOCTYPE html>

<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background-color: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .header p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .card {
      background-color: #0f172a;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .card h3 {
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #10b981;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }
    .success { color: #34d399; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>預約免費自動化諮詢</h1>
      <p>告別重複手動 key 單！為你的業務打造 24h 自動化營運系統</p>
    </div>

    <div class="features">
      <div class="card">
        <h3>01. 自動化到帳與資料同步</h3>
        <p>顧客填單後，資料 0.1 秒自動降落至 Google Sheets。</p>
      </div>
      <div class="card">
        <h3>02. Telegram 即時通知</h3>
        <p>新單抵達時，手機即時收到訊息通知，不漏單。</p>
      </div>
      <div class="card">
        <h3>03. 自動客戶致謝與跟進</h3>
        <p>系統自動發送確認信件，提升客製化專業感。</p>
      </div>
    </div>

    <form id="leadForm">
      <div class="form-group">
        <label for="name">您的姓名 / 稱呼</label>
        <input type="text" id="name" required placeholder="例如：李先生">
      </div>

      <div class="form-group">
        <label for="contact">聯絡方式 (LINE ID 或 Email)</label>
        <input type="text" id="contact" required placeholder="例如：line_id_123 或 name@email.com">
      </div>

      <div class="form-group">
        <label for="need">目前最困擾你、想自動化的流程是什麼？</label>
        <textarea id="need" required placeholder="例如：每天要手動複製資料到 Excel，想改成自動帶入..."></textarea>
      </div>

      <button type="submit" id="submitBtn">送出需求，取得免費評估</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.textContent = '處理中，請稍候...';
      statusMsg.textContent = '';
      statusMsg.className = 'status-msg';

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const formattedTimestamp = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

      const formData = {
        name: document.getElementById('name').value,
        contact: document.getElementById('contact').value,
        need: document.getElementById('need').value,
        timestamp: formattedTimestamp
      };

      try {
        const response = await fetch('https://apeter321w.zeabur.app/webhook/5e2bb1ce-7f7f-4a42-b6df-3490b2ac0124', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          statusMsg.textContent = '✅ 感謝您的預約！我們將儘快與您聯絡。';
          statusMsg.classList.add('success');
          form.reset();
        } else {
          throw new Error('伺服器回應異常');
        }
      } catch (error) {
        console.error('Submission Error:', error);
        statusMsg.textContent = '❌ 送出失敗，請重試或直接聯絡客服。';
        statusMsg.classList.add('error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '送出需求，取得免費評估';
      }
    });
  </script>
</body>
</html>
